<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRMScope - Employment Data Insight</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Load Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">NRMScope</a>
            <span class="navbar-text text-white">Employment Data Insight (SDGs 8)</span>
        </div>
    </nav>

    <div class="container mb-5">
        
        <!-- Panel Filter -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Filter Karakteristik Penduduk</h5>
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Tahun</label>
                        <select id="filterTahun" class="form-select"><option value="All">Semua Tahun</option></select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Provinsi</label>
                        <select id="filterProvinsi" class="form-select"><option value="All">Semua Provinsi</option></select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Pendidikan</label>
                        <select id="filterPendidikan" class="form-select"><option value="All">Semua Pendidikan</option></select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Jenis Kelamin</label>
                        <select id="filterGender" class="form-select"><option value="All">Semua Gender</option></select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card bg-white shadow-sm border-start border-primary border-4">
                    <div class="card-body">
                        <h6 class="text-muted">Total Pengangguran</h6>
                        <h3 id="cardTotal" class="text-primary fw-bold">0 Jiwa</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card bg-white shadow-sm border-start border-success border-4">
                    <div class="card-body">
                        <h6 class="text-muted">Rata-rata TPT (%)</h6>
                        <h3 id="cardTPT" class="text-success fw-bold">0 %</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Area Chart / Visualisasi Grafik -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Grafik Pengangguran Berdasarkan Pendidikan</h5>
                        <canvas id="chartPendidikan" height="100"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabel Detail Data -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-3">Tabel Detail Data</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-primary">
                            <tr>
                                <th>Tahun</th>
                                <th>Provinsi</th>
                                <th>Jenis Kelamin</th>
                                <th>Pendidikan</th>
                                <th>Jumlah Pengangguran</th>
                                <th>TPT (%)</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        let myChart = null;

        document.addEventListener('DOMContentLoaded', function() {
            fetch('/api/filter-options')
                .then(res => res.json())
                .then(data => {
                    populateDropdown('filterTahun', data.tahun);
                    populateDropdown('filterProvinsi', data.provinsi);
                    populateDropdown('filterPendidikan', data.pendidikan);
                    populateDropdown('filterGender', data.gender);
                });

            const filters = ['filterTahun', 'filterProvinsi', 'filterPendidikan', 'filterGender'];
            filters.forEach(id => {
                document.getElementById(id).addEventListener('change', loadDashboardData);
            });

            loadDashboardData();
        });

        function populateDropdown(elementId, items) {
            const dropdown = document.getElementById(elementId);
            items.forEach(item => {
                dropdown.innerHTML += `<option value="${item}">${item}</option>`;
            });
        }

        function loadDashboardData() {
            const tahun = document.getElementById('filterTahun').value;
            const provinsi = document.getElementById('filterProvinsi').value;
            const pendidikan = document.getElementById('filterPendidikan').value;
            const gender = document.getElementById('filterGender').value;

            const url = `/api/dashboard-data?tahun=${tahun}&provinsi=${provinsi}&pendidikan=${pendidikan}&gender=${gender}`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('cardTotal').innerText = data.summary.total_pengangguran.toLocaleString('id-ID') + ' Jiwa';
                    document.getElementById('cardTPT').innerText = data.summary.avg_tpt + ' %';

                    const tbody = document.getElementById('tableBody');
                    tbody.innerHTML = '';
                    data.detail_data.forEach(row => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${row.tahun}</td>
                                <td>${row.nama_provinsi}</td>
                                <td>${row.jenis_kelamin}</td>
                                <td>${row.tingkat_pendidikan}</td>
                                <td>${row.jumlah_pengangguran.toLocaleString('id-ID')}</td>
                                <td>${row.tpt_persen}%</td>
                            </tr>
                        `;
                    });

                    renderChart(data.detail_data);
                });
        }

        function renderChart(data) {
            const groupedData = {};
            data.forEach(row => {
                const edu = row.tingkat_pendidikan;
                groupedData[edu] = (groupedData[edu] || 0) + row.jumlah_pengangguran;
            });

            const labels = Object.keys(groupedData);
            const values = Object.values(groupedData);

            if (myChart) {
                myChart.destroy();
            }

            const ctx = document.getElementById('chartPendidikan').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Jumlah Pengangguran (Jiwa)',
                        data: values,
                        backgroundColor: '#0d6efd'
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }
    </script>
</body>
</html>
